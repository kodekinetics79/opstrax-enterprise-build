#cloud-config
# OpsTrax telematics device edge — first-boot provisioning for a fresh Ubuntu 22.04/24.04 VPS.
#
# Paste into:
#   AWS EC2      — "User data" at launch
#   AWS Lightsail— "Launch script"
#   DigitalOcean — "User data" under Advanced Options
#
# This prepares the HOST. It does not install the gateway binary — publish and rsync that, then
# run deploy/install.sh. See deploy/README.md for the full sequence.
#
# BEFORE the tracker is configured, attach a STATIC address (EC2 Elastic IP / Lightsail static IP
# / DigitalOcean reserved IP). A tracker's SERVER command bakes the address in, and changing it on
# a deployed unit means physical access or an SMS command through the carrier.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - chrony
  - fail2ban
  - rsync

users:
  - name: opstrax
    system: true
    shell: /usr/sbin/nologin
    lock_passwd: true

write_files:
  # The HMAC timestamp must land within +/-300s of OpsTrax or every fix is rejected as
  # unauthorized — with a perfectly valid secret. That failure reads like a credential problem
  # and is not, so the clock is disciplined before anything else.
  - path: /etc/chrony/conf.d/opstrax.conf
    permissions: '0644'
    content: |
      # Tight polling: clock drift on this host presents as fleet-wide 401s.
      maxpoll 10
      makestep 1.0 3

  - path: /etc/opstrax/imei-allowlist.txt
    owner: root:opstrax
    permissions: '0640'
    content: |
      # One IMEI per line; '#' starts a comment. Re-read within ~15s of a change.
      # An empty or unreadable file admits NOTHING — that is deliberate.

  - path: /etc/sysctl.d/60-opstrax-edge.conf
    permissions: '0644'
    content: |
      # A device edge holds thousands of long-lived, mostly-idle cellular sockets.
      net.core.somaxconn = 1024
      net.ipv4.tcp_max_syn_backlog = 2048
      # Detect half-open sockets from trackers that vanished without a FIN. The gateway's own
      # 5-minute idle timeout is the primary defence; this is the kernel-level backstop.
      net.ipv4.tcp_keepalive_time = 300
      net.ipv4.tcp_keepalive_intvl = 60
      net.ipv4.tcp_keepalive_probes = 5
      # SYN flood resistance on a port that is open to the whole internet.
      net.ipv4.tcp_syncookies = 1

runcmd:
  - [ install, -d, -o, root,    -g, opstrax, -m, '0750', /etc/opstrax ]
  - [ install, -d, -o, opstrax, -g, opstrax, -m, '0750', /var/lib/opstrax-gateway ]
  - [ install, -d, -o, opstrax, -g, opstrax, -m, '0750', /var/lib/opstrax-gateway/outbox ]
  - [ install, -d, -o, root,    -g, opstrax, -m, '0755', /opt/opstrax/gateway ]

  - [ sysctl, --system ]
  - [ timedatectl, set-ntp, 'true' ]
  - [ systemctl, enable, --now, chrony ]

  # Firewall. SSH stays open so you can finish the install; narrow it to your own address
  # immediately after (`ufw allow from <your-ip> to any port 22 && ufw delete allow 22/tcp`).
  - [ ufw, default, deny, incoming ]
  - [ ufw, default, allow, outgoing ]
  - [ ufw, allow, '22/tcp' ]
  # The tracker port. Cellular units roam across carrier NAT, so this cannot be pinned to a
  # source range in general — the IMEI allowlist is what stops an open port being an open relay.
  # If your carrier publishes egress ranges, replace this with `ufw allow from <range>`.
  - [ ufw, allow, '5023/tcp', comment, 'OpsTrax tracker edge' ]
  - [ ufw, --force, enable ]

  - [ systemctl, enable, --now, fail2ban ]

  # Journald: keep enough history to reconstruct an incident, bounded so logs cannot fill the disk
  # the outbox depends on.
  - [ mkdir, -p, /etc/systemd/journald.conf.d ]
  - [ sh, -c, 'printf "[Journal]\nSystemMaxUse=512M\nMaxRetentionSec=14day\n" > /etc/systemd/journald.conf.d/opstrax.conf' ]
  - [ systemctl, restart, systemd-journald ]

final_message: |
  OpsTrax edge host ready after $UPTIME seconds.

  Next:
    1. Confirm a STATIC public IP is attached.
    2. Publish and copy the gateway:
         dotnet publish telematics/src/Opstrax.Telematics.Gateway/Opstrax.Telematics.Gateway.csproj -c Release -o ./publish
         rsync -a ./publish/          root@<ip>:/opt/opstrax/gateway/
         rsync -a telematics/deploy/  root@<ip>:/opt/opstrax/deploy/
    3. sudo /opt/opstrax/deploy/install.sh --gateway-id <id> --base-url https://<opstrax> --secret <secret>
    4. Narrow SSH to your own address.
