# OpsTrax telematics device edge — container deployment.
#
# An alternative to the systemd path (install.sh) for hosts that already run Docker. The
# systemd unit is the better fit for a single-purpose VPS: it gives finer sandboxing
# (SystemCallFilter, ProtectSystem=strict) than a container does by default.
#
# BUILD CONTEXT IS THE REPOSITORY ROOT. The Dockerfile COPYs telematics/src/..., so:
#   docker compose -f telematics/deploy/docker-compose.yml --project-directory . up -d --build

services:
  gateway:
    build:
      context: ../..
      dockerfile: telematics/Dockerfile
    image: opstrax/telematics-gateway:local
    restart: unless-stopped

    ports:
      # Raw TCP. Do NOT put an HTTP proxy, TLS terminator, or L7 load balancer in front of this:
      # anything that inspects or rewrites the stream corrupts the binary framing.
      - "5023:5023/tcp"

    environment:
      DOTNET_ENVIRONMENT: Production

      Gateway__ListenAddress: "0.0.0.0"
      Gateway__ListenPort: "5023"

      # HTTPS forwarding: no database credentials on this host.
      Gateway__Edge__Egress: "Https"
      Gateway__Edge__Forward__BaseUrl: "${OPSTRAX_BASE_URL:?set OPSTRAX_BASE_URL}"
      Gateway__Edge__Forward__GatewayId: "${OPSTRAX_GATEWAY_ID:?set OPSTRAX_GATEWAY_ID}"
      # Supplied via the environment or an .env file beside this compose file. Never inline it.
      Gateway__Edge__Forward__Secret: "${OPSTRAX_GATEWAY_SECRET:?set OPSTRAX_GATEWAY_SECRET}"

      Gateway__Edge__Allowlist__Path: "/etc/opstrax/imei-allowlist.txt"
      Gateway__Edge__Outbox__Path: "/var/lib/opstrax-gateway/outbox"

      Gateway__Edge__Protocols__Gt06: "true"
      Gateway__Edge__Protocols__PacificTrack__Enabled: "false"

    volumes:
      # Read-only: the edge never edits its own admission list. Edits on the host are picked up
      # within ~15s without a restart. NOTE: relative paths here resolve against
      # --project-directory (the repo root), not against this file.
      - ./telematics/deploy/imei-allowlist.txt:/etc/opstrax/imei-allowlist.txt:ro
      # A NAMED VOLUME, not a tmpfs: this is the store-and-forward queue, and losing it on restart
      # converts an OpsTrax outage from a delay into data loss.
      - outbox:/var/lib/opstrax-gateway/outbox

    # The container clock follows the host's. Keep the HOST disciplined (chrony/timesyncd) or the
    # HMAC timestamp drifts outside the +/-300s window and every fix is rejected as unauthorized.

    healthcheck:
      # The listener accepting a connection is the only thing an external check can observe;
      # there is no HTTP surface by design.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/5023' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  outbox:
