services:
  - type: web
    name: opstrax-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./backend-dotnet/Dockerfile
    dockerContext: .
    # Readiness (not liveness) so Render only routes traffic once the DB is
    # reachable AND critical config is valid; returns 503 until then. See
    # /health/ready in Program.cs.
    healthCheckPath: /health/ready
    # Release candidates are promoted only after exact-SHA evidence and approval.
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: PORT
        value: "8080"
      # Structured JSON logs (trace_id/correlation_id enriched). Defaults on in
      # Production; set false to fall back to the human-readable console logger.
      - key: Logging__Json
        value: "true"
      # Deploy version surfaced in /health, logs, traces, and the Reliability
      # Center. Render also injects RENDER_GIT_COMMIT automatically, used as the
      # fallback — leave OPSTRAX_DEPLOY_VERSION unset to auto-track the commit.
      - key: OPSTRAX_DEPLOY_VERSION
        sync: false
      # Restricted application identity. Never use the owner/migration credential.
      - key: PG_CONNECTION_APP
        sync: false
      # Separate control-plane/background identity provisioned by Stage58.
      - key: PG_CONNECTION_SYSTEM
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Telemetry__DeviceSecret
        sync: false
      - key: Telemetry__GatewaySecret
        sync: false
      # MUST stay "false" here. ConfigValidationService treats an enabled simulator
      # as a CRITICAL failure in any protected environment (Production or Staging)
      # and aborts startup: protected environments accept authenticated device or
      # provider fixes only. Setting this true crash-loops the service.
      # For live telematics use a real provider feed (docs/TELEMATICS_INTEGRATION.md
      # option A); the simulator is for Development only.
      - key: Telemetry__Simulator__Enabled
        value: "false"
      - key: Sse__TicketKey
        sync: false
      # Production startup fails closed unless tenant context is applied to every
      # RLS-protected request transaction.
      - key: Rls__EnforceTenantContext
        value: "true"
      - key: Rls__TenantTicketTtlSeconds
        value: "120"
      # Shared ASP.NET Data Protection certificate (base64 PKCS12/PFX). The key ring
      # itself is stored in Neon by Stage59; every instance uses this certificate.
      - key: DATA_PROTECTION_CERTIFICATE_BASE64
        sync: false
      - key: DATA_PROTECTION_CERTIFICATE_PASSWORD
        sync: false
      # Optional prior PFX retained only during certificate/key-ring rotation.
      - key: DATA_PROTECTION_PREVIOUS_CERTIFICATE_BASE64
        sync: false
      - key: DATA_PROTECTION_PREVIOUS_CERTIFICATE_PASSWORD
        sync: false
      # OPTIONAL Neon read-replica connection string. When set, read-only queries
      # can be offloaded here and reads survive a primary blip (auto-fallback to
      # primary). Leave unset to route everything to the primary.
      - key: PG_CONNECTION_REPLICA
        sync: false
      # ── Data protection (PII encryption at rest) ──────────────────────────────
      # base64 of 32 random bytes: `openssl rand -base64 32`. Enables AES-256-GCM
      # encryption of sensitive PII columns. KMS-swappable (see IDataKeyProvider).
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Optional previous key (base64) to keep old ciphertext readable during a rotation.
      - key: DATA_ENCRYPTION_KEY_PREVIOUS
        sync: false
      # Optional dedicated HMAC key (base64) for blind-index lookups; derived from
      # DATA_ENCRYPTION_KEY if unset.
      - key: PII_INDEX_KEY
        sync: false
      # ── Object storage (S3-compatible: Cloudflare R2 / AWS S3 / Backblaze B2) ──
      # Durable store for uploaded PODs/signatures/documents. Without these the app
      # falls back to a NON-durable local dev store (flagged in the Reliability Center).
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # R2/MinIO/B2 endpoint (e.g. https://<acct>.r2.cloudflarestorage.com). Omit for AWS S3.
      - key: STORAGE_ENDPOINT
        sync: false
      # AWS region (used only when STORAGE_ENDPOINT is unset).
      - key: STORAGE_REGION
        sync: false
      # Required in Production. Config validation refuses startup unless the
      # operator explicitly sets this to true after policy approval.
      - key: RetentionWorker__Enabled
        sync: false
      # Allowed frontend origin(s) for CORS — set to the deployed Vercel URL.
      - key: Cors__AllowedOrigins
        sync: false
      # Bootstrap Platform Admin credential, and the DECLARED DESIRED STATE for that
      # identity. MUST be set explicitly in production — ConfigValidationService fails
      # /health/deep if unset or left at the default.
      #
      # PlatformSuperAdminReconciler reconciles these into the database on EVERY boot
      # (see backend-dotnet/Services/PlatformSuperAdminReconciler.cs): it creates the
      # account if the email is absent, repairs anything that blocks sign-in (disabled,
      # pending invite, missing super-admin role), and applies the password whenever the
      # declared credential is not already the one in force. So the fix for "Platform
      # Admin rejects my credentials" is simply: set these two, redeploy. No flag needed.
      # A later self-service password change is NOT overwritten, because the reconciler
      # only rewrites the password when these values actually change.
      - key: PLATFORM_SUPERADMIN_EMAIL
        sync: false
      - key: PLATFORM_SUPERADMIN_PASSWORD
        sync: false
      # FORCE override for the one case the above cannot detect: the env credential is
      # unchanged but the password was changed inside the app and forgotten. Set to
      # "true", redeploy, sign in, then set it back to "false" — while armed it re-applies
      # the env password on every boot, overwriting any in-app change.
      - key: PLATFORM_SUPERADMIN_RESET
        value: "false"
      # Opt OUT of env reconciliation entirely ("off"/"never") — only for a deployment
      # that wants the database to be the sole owner of the bootstrap password. Leaving
      # this unset keeps the self-healing behaviour that prevents permanent lockout.
      # - key: PLATFORM_SUPERADMIN_SYNC
      #   value: "off"
      - key: DemoSeed__Enabled
        value: "false"
      - key: DemoSeed__Password
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
