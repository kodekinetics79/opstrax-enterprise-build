name: opstrax

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opstrax-frontend
    restart: unless-stopped
    ports:
      - "10000:8080"
    depends_on:
      - api-dotnet

  api-dotnet:
    build:
      context: .
      dockerfile: backend-dotnet/Dockerfile
    container_name: opstrax-dotnet-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # RLS ENFORCEMENT: connect as the restricted, non-BYPASSRLS app role and turn on
      # per-request tenant scoping. This makes Postgres RLS the active backstop so any
      # read missing a company_id predicate fail-closes to the current tenant instead of
      # leaking cross-tenant. No owner-identity fallback is permitted in the API.
      ConnectionStrings__DefaultConnection: ${PG_CONNECTION_APP:?PG_CONNECTION_APP must use opstrax_app}
      ConnectionStrings__SystemConnection: ${PG_CONNECTION_SYSTEM:?PG_CONNECTION_SYSTEM must use opstrax_system}
      Rls__EnforceTenantContext: "true"
      Rls__TenantTicketTtlSeconds: ${RLS_TENANT_TICKET_TTL_SECONDS:-120}
      OutboxDispatcher__Enabled: "true"
      OutboxDispatcher__AllowProduction: "true"
      DATA_PROTECTION_CERTIFICATE_BASE64: ${DATA_PROTECTION_CERTIFICATE_BASE64:?base64 PKCS12 Data Protection certificate required}
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?Data Protection certificate password required}
      DATA_PROTECTION_PREVIOUS_CERTIFICATE_BASE64: ${DATA_PROTECTION_PREVIOUS_CERTIFICATE_BASE64:-}
      DATA_PROTECTION_PREVIOUS_CERTIFICATE_PASSWORD: ${DATA_PROTECTION_PREVIOUS_CERTIFICATE_PASSWORD:-}
      Cors__AllowedOrigins: http://localhost:10000
      Jwt__Key: ${JWT_KEY}
      # The legacy fleet-wide telemetry device/gateway secret env entries were removed:
      # the device one is dead config, and any non-blank Telemetry:GatewaySecret makes
      # ConfigValidationService refuse startup in Production/Staging. Per-gateway
      # credentials live encrypted in telemetry_gateways; do not re-add these keys.
      Telemetry__Simulator__Enabled: ${TELEMETRY_SIMULATOR_ENABLED:-false}
      RetentionWorker__Enabled: ${RETENTION_WORKER_ENABLED:?RETENTION_WORKER_ENABLED must be explicitly true in Production}
      Sse__TicketKey: ${SSE_TICKET_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      PLATFORM_SUPERADMIN_PASSWORD: ${PLATFORM_SUPERADMIN_PASSWORD}
      PLATFORM_SUPERADMIN_EMAIL: ${PLATFORM_SUPERADMIN_EMAIL:-platform@opstrax.local}
      DemoSeed__Enabled: ${DEMO_SEED_ENABLED:-false}
      DemoSeed__Password: ${DEMO_SEED_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      PII_INDEX_KEY: ${PII_INDEX_KEY:-}
    ports:
      - "8088:8080"
