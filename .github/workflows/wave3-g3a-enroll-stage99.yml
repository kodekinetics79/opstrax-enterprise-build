name: Wave3 G3A enroll Stage99

on:
  push:
    branches:
      - wave3/g3a-hos-workflow
    paths:
      - .github/workflows/wave3-g3a-enroll-stage99.yml

permissions:
  contents: write

jobs:
  enroll-stage99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave3/g3a-hos-workflow
          fetch-depth: 0

      - name: Enroll Stage99 after Stage98
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-neon-predeploy-migrations.sh')
          text = path.read_text()
          target = '2026_09_03_stage99_hos_clock_source_truth'
          if target in text:
              print('Stage99 already enrolled')
              raise SystemExit(0)
          anchor = '  # Explicit unknown GPS measurements; preserve old producer defaults and rows.\n  2026_09_02_stage98_optional_gps_measurements\n'
          if anchor not in text:
              raise SystemExit('Stage98 tail anchor not found; refusing non-deterministic edit')
          replacement = anchor + '  # HOS legal-time values fail closed unless an authoritative source is persisted.\n  2026_09_03_stage99_hos_clock_source_truth\n'
          path.write_text(text.replace(anchor, replacement, 1))
          PY
          git diff --check

      - name: Commit runner enrollment
        shell: bash
        run: |
          if git diff --quiet -- tools/apply-neon-predeploy-migrations.sh; then
            echo 'No runner change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apply-neon-predeploy-migrations.sh
          git commit -m 'fix(migrations): enroll Stage99 HOS source truth'
          git push origin HEAD:wave3/g3a-hos-workflow
