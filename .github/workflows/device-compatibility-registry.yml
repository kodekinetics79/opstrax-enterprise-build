name: DeviceOps compatibility registry

on:
  pull_request:
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceCompatibilityTruth.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet/Controllers/PlatformEndpoints.cs'
      - 'backend-dotnet/Services/PlatformSchemaService.cs'
      - 'backend-dotnet.Tests/PlatformHardwareReadinessContractTests.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityRegistryPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityTruthTests.cs'
      - 'backend-dotnet.Tests/TelemetryCredentialHardeningTests.cs'
      - 'database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql'
      - 'database/migrations/2026_09_08_stage128_device_compatibility_capability_catalog.sql'
      - 'database/migrations/2026_09_11_stage136_platform_hardware_readiness_permission.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/pages/platform/PlatformHardwareReadinessPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-compatibility-truth-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-compatibility-registry.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceCompatibilityTruth.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet/Controllers/PlatformEndpoints.cs'
      - 'backend-dotnet/Services/PlatformSchemaService.cs'
      - 'backend-dotnet.Tests/PlatformHardwareReadinessContractTests.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityRegistryPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityTruthTests.cs'
      - 'backend-dotnet.Tests/TelemetryCredentialHardeningTests.cs'
      - 'database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql'
      - 'database/migrations/2026_09_08_stage128_device_compatibility_capability_catalog.sql'
      - 'database/migrations/2026_09_11_stage136_platform_hardware_readiness_permission.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/pages/platform/PlatformHardwareReadinessPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-compatibility-truth-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-compatibility-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-compatibility-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-hold-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opstrax_deviceops_stage128
        ports:
          - 55454:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opstrax_deviceops_stage128"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      OPSTRAX_DEVICEOPS_STAGE128_DB: Host=127.0.0.1;Port=55454;Database=opstrax_deviceops_stage128;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Create restricted runtime roles required by owner migrations
        run: |
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opstrax_app') THEN CREATE ROLE opstrax_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'deviceops-app-ci-only'; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opstrax_system') THEN CREATE ROLE opstrax_system LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'deviceops-system-ci-only'; END IF; END \$\$;"
      - name: Build dedicated DeviceOps database
        run: |
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/init/001_schema.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_07_02_stage23_schema_migration_ledger.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_07_02_stage26_platform_control_plane.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_08_12_stage77_protected_role_bootstrap.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_08_stage128_device_compatibility_capability_catalog.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_11_stage136_platform_hardware_readiness_permission.sql
      - name: Verify repeat-safe migration
        run: |
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_08_stage128_device_compatibility_capability_catalog.sql
          psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_11_stage136_platform_hardware_readiness_permission.sql
          test "$(psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -tAc "SELECT count(*) FROM platform_role_permissions p JOIN platform_roles r ON r.id=p.role_id WHERE r.role_key='product_admin' AND p.permission_key IN ('platform:devices:view','platform:devices:manage')")" = "2"
          test "$(psql -h 127.0.0.1 -p 55454 -U postgres -d opstrax_deviceops_stage128 -tAc "SELECT has_table_privilege('opstrax_app','device_compatibility_candidates','INSERT,UPDATE,DELETE'),has_table_privilege('opstrax_system','device_compatibility_candidates','SELECT,INSERT,UPDATE,DELETE')")" = "f|t"
      - name: Run DeviceOps truth and PostgreSQL tests
        run: >-
          dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj
          --filter "FullyQualifiedName~DeviceCompatibilityRegistryPostgresTests|FullyQualifiedName~DeviceCompatibilityTruthTests|FullyQualifiedName~TelemetryCredentialHardeningTests|FullyQualifiedName~PlatformHardwareReadinessContractTests"
          --logger "console;verbosity=minimal"
      - name: Verify customer compatibility surface
        run: npm --prefix frontend run test:device-compatibility-truth
      - name: Build customer device surface
        run: npm --prefix frontend run build
