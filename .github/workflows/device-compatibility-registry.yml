name: DeviceOps compatibility registry

on:
  pull_request:
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceCompatibilityTruth.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityRegistryPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityTruthTests.cs'
      - 'backend-dotnet.Tests/TelemetryCredentialHardeningTests.cs'
      - 'database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-compatibility-truth-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-compatibility-registry.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceCompatibilityTruth.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityRegistryPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceCompatibilityTruthTests.cs'
      - 'backend-dotnet.Tests/TelemetryCredentialHardeningTests.cs'
      - 'database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-compatibility-truth-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-compatibility-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-compatibility-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-hold-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opstrax_deviceops_stage115
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opstrax_deviceops_stage115"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      OPSTRAX_DEVICEOPS_STAGE115_DB: Host=127.0.0.1;Port=55443;Database=opstrax_deviceops_stage115;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build dedicated DeviceOps database
        run: |
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage115 -v ON_ERROR_STOP=1 -f database/init/001_schema.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage115 -v ON_ERROR_STOP=1 -f database/migrations/2026_07_02_stage23_schema_migration_ledger.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage115 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql
      - name: Verify repeat-safe migration
        run: psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage115 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql
      - name: Run DeviceOps truth and PostgreSQL tests
        run: >-
          dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj
          --filter "FullyQualifiedName~DeviceCompatibilityRegistryPostgresTests|FullyQualifiedName~DeviceCompatibilityTruthTests|FullyQualifiedName~TelemetryCredentialHardeningTests"
          --logger "console;verbosity=minimal"
      - name: Verify customer compatibility surface
        run: npm --prefix frontend run test:device-compatibility-truth
      - name: Build customer device surface
        run: npm --prefix frontend run build
