name: DeviceOps remote command governance

on:
  pull_request:
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceRemoteCommandPolicy.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet/Services/FleetProductionReadinessService.cs'
      - 'backend-dotnet/Security/PermissionPolicy.cs'
      - 'backend-dotnet.Tests/DeviceRemoteCommandPolicyTests.cs'
      - 'backend-dotnet.Tests/DeviceRemoteCommandPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceRemoteCommandEndpointContractTests.cs'
      - 'backend-dotnet.Tests/Fixtures/device_remote_command_test_prerequisites.sql'
      - 'database/migrations/2026_08_11_stage76_telematics_security_hardening.sql'
      - 'database/migrations/2026_09_07_stage112_camera_provider_ingest_spine.sql'
      - 'database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql'
      - 'database/migrations/2026_09_07_stage116_device_connectivity_profiles.sql'
      - 'database/migrations/2026_09_07_stage117_device_firmware_campaign_planning.sql'
      - 'database/migrations/2026_09_07_stage118_device_rma_replacement.sql'
      - 'database/migrations/2026_09_07_stage119_device_remote_command_governance.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'tools/test-predeploy-clean-chain.sh'
      - 'frontend/src/auth/rbacConfig.ts'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-remote-command-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-remote-command-governance.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceRemoteCommandPolicy.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet/Services/FleetProductionReadinessService.cs'
      - 'backend-dotnet/Security/PermissionPolicy.cs'
      - 'backend-dotnet.Tests/DeviceRemoteCommandPolicyTests.cs'
      - 'backend-dotnet.Tests/DeviceRemoteCommandPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceRemoteCommandEndpointContractTests.cs'
      - 'backend-dotnet.Tests/Fixtures/device_remote_command_test_prerequisites.sql'
      - 'database/migrations/2026_08_11_stage76_telematics_security_hardening.sql'
      - 'database/migrations/2026_09_07_stage112_camera_provider_ingest_spine.sql'
      - 'database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql'
      - 'database/migrations/2026_09_07_stage116_device_connectivity_profiles.sql'
      - 'database/migrations/2026_09_07_stage117_device_firmware_campaign_planning.sql'
      - 'database/migrations/2026_09_07_stage118_device_rma_replacement.sql'
      - 'database/migrations/2026_09_07_stage119_device_remote_command_governance.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'tools/test-predeploy-clean-chain.sh'
      - 'frontend/src/auth/rbacConfig.ts'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-remote-command-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-remote-command-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-remote-command-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-governed-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opstrax_deviceops_stage119
        ports:
          - 55444:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opstrax_deviceops_stage119"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      OPSTRAX_DEVICEOPS_STAGE119_DB: Host=127.0.0.1;Port=55444;Database=opstrax_deviceops_stage119;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build dedicated command-governance database
        run: |
          psql -h 127.0.0.1 -p 55444 -U postgres -d opstrax_deviceops_stage119 -v ON_ERROR_STOP=1 -f database/init/001_schema.sql
          psql -h 127.0.0.1 -p 55444 -U postgres -d opstrax_deviceops_stage119 -v ON_ERROR_STOP=1 -f database/migrations/2026_07_02_stage23_schema_migration_ledger.sql
          psql -h 127.0.0.1 -p 55444 -U postgres -d opstrax_deviceops_stage119 -v ON_ERROR_STOP=1 -f backend-dotnet.Tests/Fixtures/device_connectivity_test_prerequisites.sql
          psql -h 127.0.0.1 -p 55444 -U postgres -d opstrax_deviceops_stage119 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql
          psql -h 127.0.0.1 -p 55444 -U postgres -d opstrax_deviceops_stage119 -v ON_ERROR_STOP=1 -f backend-dotnet.Tests/Fixtures/device_remote_command_test_prerequisites.sql
          psql -h 127.0.0.1 -p 55444 -U postgres -d opstrax_deviceops_stage119 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage119_device_remote_command_governance.sql
      - name: Verify repeat-safe migration
        run: psql -h 127.0.0.1 -p 55444 -U postgres -d opstrax_deviceops_stage119 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage119_device_remote_command_governance.sql
      - name: Run command policy, endpoint and PostgreSQL tests
        run: >-
          dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj
          --filter "FullyQualifiedName~DeviceRemoteCommandPolicyTests|FullyQualifiedName~DeviceRemoteCommandPostgresTests|FullyQualifiedName~DeviceRemoteCommandEndpointContractTests"
          --logger "console;verbosity=minimal"
      - name: Verify customer command truth
        run: npm --prefix frontend run test:device-remote-command
      - name: Build customer device surface
        run: npm --prefix frontend run build
