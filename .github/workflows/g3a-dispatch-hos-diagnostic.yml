name: G3A Dispatch HOS Diagnostic

on:
  push:
    branches:
      - wave3/g3a-hos-workflow
    paths:
      - .github/workflows/g3a-dispatch-hos-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: wave3/g3a-hos-workflow
          fetch-depth: 0
      - name: Extract bounded dispatch HOS windows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source_path = Path('backend-dotnet/Controllers/EndpointMappings.cs')
          lines = source_path.read_text().splitlines()
          terms = ('hos_records', 'remaining_drive_hours', 'available_hos_hours', 'CheckDispatchEligibilityAsync')
          hits = [i for i, line in enumerate(lines) if any(term in line for term in terms)]
          merged = []
          for i in hits:
              start, end = max(0, i - 28), min(len(lines), i + 45)
              if merged and start <= merged[-1][1] + 5:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          out = [f'EndpointMappings lines={len(lines)} hits={len(hits)} windows={len(merged)}', '']
          for start, end in merged:
              out.append(f'--- lines {start+1}-{end} ---')
              for n in range(start, end):
                  clean = lines[n].rstrip()
                  out.append(f'{n+1:05d}: {clean}' if clean else f'{n+1:05d}:')
              out.append('')
          report = Path('docs/commercialization/wave3/G3A_DISPATCH_HOS_DIAGNOSTIC.txt')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('\n'.join(out).rstrip() + '\n')
          PY
      - name: Commit diagnostic evidence
        run: |
          git config user.name "opstrax-wave3-bot"
          git config user.email "opstrax-wave3-bot@users.noreply.github.com"
          git add docs/commercialization/wave3/G3A_DISPATCH_HOS_DIAGNOSTIC.txt
          git diff --cached --check
          git commit -m "docs(wave3): capture dispatch HOS authority diagnostic"
          git push origin HEAD:wave3/g3a-hos-workflow
