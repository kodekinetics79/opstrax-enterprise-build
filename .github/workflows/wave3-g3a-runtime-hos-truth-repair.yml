name: Wave3 G3A Runtime HOS Truth Repair

on:
  push:
    branches:
      - wave3/g3a-hos-workflow
    paths:
      - .github/workflows/wave3-g3a-runtime-hos-truth-repair.yml

permissions:
  contents: write

jobs:
  repair-runtime-hos-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: wave3/g3a-hos-workflow
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Repair Batch6 HOS runtime source truth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend-dotnet/Services/Batch6SchemaService.cs')
          source = path.read_text()

          replacements = {
              '"drive_time_remaining_minutes", "INT NOT NULL"': '"drive_time_remaining_minutes", "INT NULL"',
              '"shift_time_remaining_minutes", "INT NOT NULL"': '"shift_time_remaining_minutes", "INT NULL"',
              '"cycle_time_remaining_minutes", "INT NOT NULL"': '"cycle_time_remaining_minutes", "INT NULL"',
              '"status", "VARCHAR(24) NOT NULL DEFAULT \'OK\'"': '"status", "VARCHAR(24) NOT NULL DEFAULT \'Unavailable\'"',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one runtime schema fragment {old!r}; found {count}')
              source = source.replace(old, new, 1)

          status_anchor = '    new("hos_clocks", "status", "VARCHAR(24) NOT NULL DEFAULT \'Unavailable\'", true),\n'
          source_fields = ''.join([
              '    new("hos_clocks", "clock_source", "VARCHAR(64) NULL", true),\n',
              '    new("hos_clocks", "source_event_id", "VARCHAR(160) NULL", true),\n',
              '    new("hos_clocks", "source_observed_at", "TIMESTAMPTZ NULL", true),\n',
              '    new("hos_clocks", "source_authority", "VARCHAR(24) NOT NULL DEFAULT \'Unverified\'", true),\n',
              '    new("hos_clocks", "source_quality", "VARCHAR(24) NULL", true),\n',
          ])
          if 'new("hos_clocks", "source_authority"' not in source:
              if source.count(status_anchor) != 1:
                  raise SystemExit('unique hos_clocks status anchor not found')
              source = source.replace(status_anchor, status_anchor + source_fields, 1)

          demo_rows = {
              "('HOS-001','DRV-1001',660,840,4200,'ON','OK',NOW() - INTERVAL '5 minutes')": "('HOS-001','DRV-1001',NULL,NULL,NULL,'ON','Unavailable',NOW() - INTERVAL '5 minutes')",
              "('HOS-002','DRV-1002',480,720,3600,'ON','OK',NOW() - INTERVAL '9 minutes')": "('HOS-002','DRV-1002',NULL,NULL,NULL,'ON','Unavailable',NOW() - INTERVAL '9 minutes')",
              "('HOS-003','DRV-1003',180,480,2820,'OFF','Warning',NOW() - INTERVAL '14 minutes')": "('HOS-003','DRV-1003',NULL,NULL,NULL,'OFF','Unavailable',NOW() - INTERVAL '14 minutes')",
          }
          for old, new in demo_rows.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one demo HOS seed row {old!r}; found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Run focused HOS truth tests
        run: dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj --configuration Release --filter FullyQualifiedName~HosRuntimeTruthContractTests
      - name: Commit runtime source-truth repair
        shell: bash
        run: |
          git config user.name "opstrax-wave3-bot"
          git config user.email "opstrax-wave3-bot@users.noreply.github.com"
          git add backend-dotnet/Services/Batch6SchemaService.cs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Batch6 runtime changes required."
            exit 0
          fi
          git commit -m "fix(wave3): align HOS runtime schema with Stage 99 truth"
          git push origin HEAD:wave3/g3a-hos-workflow
