name: G3A HOS Runtime Repair

on:
  push:
    branches:
      - wave3/g3a-hos-workflow
    paths:
      - .github/workflows/wave3-g3a-runtime-hos-truth-repair.yml
      - tools/repair-wave3-hos-runtime.py
      - backend-dotnet.Tests/HosRuntimeTruthContractTests.cs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: wave3/g3a-hos-workflow
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Patch Batch6
        run: python3 tools/repair-wave3-hos-runtime.py
      - name: Verify focused contract
        run: dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj --configuration Release --filter FullyQualifiedName~HosRuntimeTruthContractTests
      - name: Commit repair
        run: |
          git config user.name "opstrax-wave3-bot"
          git config user.email "opstrax-wave3-bot@users.noreply.github.com"
          git add backend-dotnet/Services/Batch6SchemaService.cs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Batch6 runtime changes required."
            exit 0
          fi
          git commit -m "fix(wave3): align HOS runtime schema with Stage 99 truth"
          git push origin HEAD:wave3/g3a-hos-workflow
