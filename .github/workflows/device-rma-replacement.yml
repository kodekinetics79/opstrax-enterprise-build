name: DeviceOps RMA and replacement

on:
  pull_request:
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceRmaPolicy.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet/Security/PermissionPolicy.cs'
      - 'backend-dotnet.Tests/DeviceRmaPolicyTests.cs'
      - 'backend-dotnet.Tests/DeviceRmaPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceRmaEndpointContractTests.cs'
      - 'database/migrations/2026_09_07_stage118_device_rma_replacement.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/auth/rbacConfig.ts'
      - 'frontend/src/components/ui.tsx'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-rma-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-rma-replacement.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/DeviceRmaPolicy.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet/Security/PermissionPolicy.cs'
      - 'backend-dotnet.Tests/DeviceRmaPolicyTests.cs'
      - 'backend-dotnet.Tests/DeviceRmaPostgresTests.cs'
      - 'backend-dotnet.Tests/DeviceRmaEndpointContractTests.cs'
      - 'database/migrations/2026_09_07_stage118_device_rma_replacement.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/auth/rbacConfig.ts'
      - 'frontend/src/components/ui.tsx'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-rma-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-rma-replacement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-rma-replacement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  append-only-support-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opstrax_deviceops_stage118
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opstrax_deviceops_stage118"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      OPSTRAX_DEVICEOPS_STAGE118_DB: Host=127.0.0.1;Port=55443;Database=opstrax_deviceops_stage118;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build dedicated RMA database
        run: |
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage118 -v ON_ERROR_STOP=1 -f database/init/001_schema.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage118 -v ON_ERROR_STOP=1 -f database/migrations/2026_07_02_stage23_schema_migration_ledger.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage118 -v ON_ERROR_STOP=1 -f backend-dotnet.Tests/Fixtures/device_connectivity_test_prerequisites.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage118 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage115_device_compatibility_candidate_registry.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage118 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage118_device_rma_replacement.sql
      - name: Verify repeat-safe migration
        run: psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_deviceops_stage118 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage118_device_rma_replacement.sql
      - name: Run RMA policy, endpoint, and PostgreSQL tests
        run: >-
          dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj
          --filter "FullyQualifiedName~DeviceRmaPolicyTests|FullyQualifiedName~DeviceRmaPostgresTests|FullyQualifiedName~DeviceRmaEndpointContractTests"
          --logger "console;verbosity=minimal"
      - name: Verify customer RMA truth
        run: npm --prefix frontend run test:device-rma
      - name: Build customer device surface
        run: npm --prefix frontend run build
