name: CI Queue Recovery

on:
  push:
    branches:
      - fix/render-migration-release-order
    paths:
      - .github/workflows/ci-queue-recovery.yml

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  recover-ci-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/render-migration-release-order
          fetch-depth: 0

      - name: Cancel superseded and draft-heavy queued CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current_branch="fix/render-migration-release-order"

          draft_branches="$(gh api "repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft == true) | .head.ref')"

          queued="$(gh api "repos/$repo/actions/runs?status=queued&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "OpsTrax CI") | [.id,.head_branch,.head_sha] | @tsv')"

          cancelled=0
          while IFS=$'\t' read -r run_id branch head_sha; do
            [ -n "${run_id:-}" ] || continue
            if [ "$branch" = "$current_branch" ] || grep -Fxq "$branch" <<<"$draft_branches"; then
              echo "Cancelling queued OpsTrax CI run $run_id for $branch@$head_sha"
              gh api -X POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null || true
              cancelled=$((cancelled + 1))
            fi
          done <<<"$queued"

          echo "Requested cancellation for $cancelled queued run(s)."

      - name: Patch CI orchestration without weakening merge gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()

          old_trigger = "on:\n  pull_request:\n  push:\n"
          new_trigger = (
              "on:\n"
              "  pull_request:\n"
              "    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]\n"
              "  push:\n"
          )
          if new_trigger not in text:
              if old_trigger not in text:
                  raise SystemExit('CI pull_request trigger anchor not found')
              text = text.replace(old_trigger, new_trigger, 1)

          concurrency_block = (
              "concurrency:\n"
              "  # Keep only the newest CI run for a PR/branch. This prevents stale commits\n"
              "  # from consuming hosted-runner slots while preserving full checks on the\n"
              "  # current merge-bound candidate.\n"
              "  group: opstrax-ci-" + "$" + "{{ github.event.pull_request.number || github.ref }}\n"
              "  cancel-in-progress: true\n\n"
          )
          if "group: opstrax-ci-" not in text:
              anchor = "permissions:\n  contents: read\n\n"
              if anchor not in text:
                  raise SystemExit('CI permissions anchor not found')
              text = text.replace(anchor, anchor + concurrency_block, 1)

          merge_bound_expr = "$" + "{{ github.event_name == 'push' || github.event.pull_request.draft == false }}"
          for job in (
              'dotnet-integration-tests',
              'production-shaped-release-rehearsal',
              'release-container-builds',
          ):
              anchor = f"  {job}:\n    runs-on: ubuntu-latest\n"
              replacement = (
                  f"  {job}:\n"
                  "    # Draft lanes keep engineering feedback moving without pretending every\n"
                  "    # work-in-progress commit is a release candidate. This full gate runs on\n"
                  "    # ready-for-review PRs and main, and is therefore still mandatory to merge.\n"
                  f"    if: {merge_bound_expr}\n"
                  "    runs-on: ubuntu-latest\n"
              )
              if replacement not in text:
                  if anchor not in text:
                      raise SystemExit(f'CI job anchor not found: {job}')
                  text = text.replace(anchor, replacement, 1)

          old_exact = "  exact-sha-release-evidence:\n    runs-on: ubuntu-latest\n    if: ${{ always() }}\n"
          exact_expr = "$" + "{{ always() && (github.event_name == 'push' || github.event.pull_request.draft == false) }}"
          new_exact = (
              "  exact-sha-release-evidence:\n"
              "    runs-on: ubuntu-latest\n"
              "    # Immutable release evidence is produced only for merge-bound candidates/main;\n"
              "    # drafts cannot merge and are re-run automatically on ready_for_review.\n"
              f"    if: {exact_expr}\n"
          )
          if new_exact not in text:
              if old_exact not in text:
                  raise SystemExit('exact-sha release evidence anchor not found')
              text = text.replace(old_exact, new_exact, 1)

          path.write_text(text)
          PY

          git diff --check
          grep -Fq 'types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]' .github/workflows/ci.yml
          grep -Fq 'group: opstrax-ci-${{ github.event.pull_request.number || github.ref }}' .github/workflows/ci.yml
          test "$(grep -Fc "if: \${{ github.event_name == 'push' || github.event.pull_request.draft == false }}" .github/workflows/ci.yml)" = "3"
          grep -Fq "if: \${{ always() && (github.event_name == 'push' || github.event.pull_request.draft == false) }}" .github/workflows/ci.yml

      - name: Run CI contract regressions
        shell: bash
        run: |
          node --test tools/launch/test_*.mjs

      - name: Commit queue recovery policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "opstrax-ci-recovery-bot"
          git config user.email "opstrax-ci-recovery-bot@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git rm .github/workflows/ci-queue-recovery.yml
          git diff --cached --check
          git commit -m "ci: prevent parallel wave runner saturation"
          git push origin HEAD:fix/render-migration-release-order
