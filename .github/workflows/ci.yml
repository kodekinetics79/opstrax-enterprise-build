          for image in opstrax-api:ci opstrax-frontend:ci opstrax-telematics-gateway:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v opstrax-trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
              image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress "$image"
          done
      - name: Generate exact-commit image provenance and CycloneDX SBOMs
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          tools/test-release-candidate-provenance.sh
          tools/collect-release-candidate-provenance.sh \
            --output artifacts/release-provenance \
            --image api=opstrax-api:ci \
            --image frontend=opstrax-frontend:ci \
            --image gateway=opstrax-telematics-gateway:ci
          test "$(awk -F '\t' '$1=="commit_sha" {print $2}' artifacts/release-provenance/candidate.tsv)" = "$CANDIDATE_SHA"
          test "$(find artifacts/release-provenance/sboms -type f -name '*.cyclonedx.json' | wc -l)" = "3"
          if awk -F '\t' 'NR>1 && $5=="NOT_EVIDENCED" {missing=1} END {exit !missing}' artifacts/release-provenance/images.tsv; then
            echo "Local image IDs and SBOMs captured; registry RepoDigests remain a deployment/publish gate." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record CI execution context
        run: |
          mkdir -p artifacts/ci-context
          {
            printf 'field\tvalue\n'
            printf 'commit_sha\t%s\n' "$CANDIDATE_SHA"
            printf 'workflow\t%s\n' "$GITHUB_WORKFLOW"
            printf 'run_id\t%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt\t%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'event_name\t%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_url\t%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > artifacts/ci-context/context.tsv
      - name: Upload intermediate release provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-provenance-${{ env.CANDIDATE_SHA }}
          path: |
            artifacts/release-provenance
            artifacts/ci-context
          if-no-files-found: error
          retention-days: 30

  exact-sha-release-evidence:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - frontend-build
      - node-backend-build
      - demo-node-events-check
      - mobile-build-test
      - launch-tooling-tests
      - playwright-public-tests
      - dotnet-build-test
      - dotnet-integration-tests
      - production-shaped-release-rehearsal
      - release-container-builds
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record mandatory gate results even when a gate fails
        id: gates
        if: ${{ always() }}
        env:
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          NODE_RESULT: ${{ needs.node-backend-build.result }}
          EVENTS_RESULT: ${{ needs.demo-node-events-check.result }}
          MOBILE_RESULT: ${{ needs.mobile-build-test.result }}
          LAUNCH_TOOLING_RESULT: ${{ needs.launch-tooling-tests.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright-public-tests.result }}
          DOTNET_RESULT: ${{ needs.dotnet-build-test.result }}
          INTEGRATION_RESULT: ${{ needs.dotnet-integration-tests.result }}
          REHEARSAL_RESULT: ${{ needs.production-shaped-release-rehearsal.result }}
          CONTAINER_RESULT: ${{ needs.release-container-builds.result }}
        run: |
          mkdir -p artifacts/mandatory-gate-results
          {
            printf 'gate\tresult\n'
            printf 'frontend-build\t%s\n' "$FRONTEND_RESULT"
            printf 'node-backend-build\t%s\n' "$NODE_RESULT"
            printf 'demo-node-events-check\t%s\n' "$EVENTS_RESULT"
            printf 'mobile-build-test\t%s\n' "$MOBILE_RESULT"
            printf 'launch-tooling-tests\t%s\n' "$LAUNCH_TOOLING_RESULT"
            printf 'playwright-public-tests\t%s\n' "$PLAYWRIGHT_RESULT"
            printf 'dotnet-build-test\t%s\n' "$DOTNET_RESULT"
            printf 'dotnet-integration-tests\t%s\n' "$INTEGRATION_RESULT"
            printf 'production-shaped-release-rehearsal\t%s\n' "$REHEARSAL_RESULT"
            printf 'release-container-builds\t%s\n' "$CONTAINER_RESULT"
          } > artifacts/mandatory-gate-results/mandatory-ci-gates.tsv
          if awk -F '\t' 'NR > 1 && $2 != "success" { failed=1 } END { exit failed }' \
            artifacts/mandatory-gate-results/mandatory-ci-gates.tsv; then
            echo 'all_success=true' >> "$GITHUB_OUTPUT"
          else
            echo 'all_success=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload mandatory gate result ledger
        id: gate_ledger
        if: ${{ always() && steps.gates.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opstrax-mandatory-gates-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: artifacts/mandatory-gate-results
          if-no-files-found: error
          retention-days: 30
      - name: Download exact-commit provenance
        if: ${{ always() && steps.gates.outputs.all_success == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-provenance-${{ env.CANDIDATE_SHA }}
          path: artifacts/exact-sha-release
      - name: Verify exact commit and mandatory success contract
        id: verify_candidate
        if: ${{ always() && steps.gates.outputs.all_success == 'true' }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(awk -F '\t' '$1=="commit_sha" {print $2}' artifacts/exact-sha-release/release-provenance/candidate.tsv)" = "$CANDIDATE_SHA"
          cp artifacts/mandatory-gate-results/mandatory-ci-gates.tsv artifacts/exact-sha-release/
          tools/validate-mandatory-ci-gates.sh --require-success artifacts/exact-sha-release/mandatory-ci-gates.tsv
          find artifacts/exact-sha-release -type f -print | LC_ALL=C sort | xargs sha256sum > artifacts/exact-sha-release-index.sha256
      - name: Upload exact-SHA release-candidate evidence
        id: release_evidence
        if: ${{ always() && steps.verify_candidate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opstrax-release-candidate-${{ env.CANDIDATE_SHA }}
          path: |
            artifacts/exact-sha-release
            artifacts/exact-sha-release-index.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable evidence identity
        if: ${{ always() && steps.release_evidence.outcome == 'success' }}
        run: |
          {
            echo "### Exact-SHA release evidence"
            echo "- Commit: \`$CANDIDATE_SHA\`"
            echo "- Artifact: \`opstrax-release-candidate-$CANDIDATE_SHA\`"
            echo "- Artifact digest: \`${{ steps.release_evidence.outputs.artifact-digest }}\`"
            echo "- Registry deploy digests: not produced by CI; capture after authorized image publication"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce release evidence outcome
        if: ${{ always() }}
        env:
          ALL_GATES_SUCCESS: ${{ steps.gates.outputs.all_success }}
          GATE_LEDGER_OUTCOME: ${{ steps.gate_ledger.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_candidate.outcome }}
          RELEASE_EVIDENCE_OUTCOME: ${{ steps.release_evidence.outcome }}
        run: |
          test "$GATE_LEDGER_OUTCOME" = "success"
          test "$ALL_GATES_SUCCESS" = "true"
          test "$VERIFY_OUTCOME" = "success"
          test "$RELEASE_EVIDENCE_OUTCOME" = "success"
