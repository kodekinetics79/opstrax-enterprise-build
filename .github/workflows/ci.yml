name: OpsTrax CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # pull_request workflows otherwise check out github's synthetic refs/pull/*/merge
  # commit. Release evidence must identify the immutable branch head that staging
  # and artifact publication consume; push workflows continue to use github.sha.
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=low
        working-directory: frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: frontend
      - run: npm run test:contracts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  node-backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=low
        working-directory: backend
      - name: Regress query parser security and Express compatibility
        run: node tools/launch/test_query_parser_security.mjs backend
      - run: npm run build
        working-directory: backend
      - name: Regress Node tenant and authentication boundaries
        run: node --test backend/tests/security-hardening.test.js

  demo-node-events-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: npm ci --no-audit --no-fund
        working-directory: services/node-events
      - run: npm audit --omit=dev --audit-level=low
        working-directory: services/node-events
      - name: Regress query parser security and Express compatibility
        run: node tools/launch/test_query_parser_security.mjs services/node-events
      - run: npm run check
        working-directory: services/node-events

  mobile-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Validate Expo 56 dependency compatibility
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo install --check
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run test:audit-policy
        working-directory: mobile
      - run: npm run test:contracts
        working-directory: mobile
      - name: Verify generated native projects expose no inbound URL registration
        run: npm run test:no-inbound-linking
        working-directory: mobile
      - name: Fail closed on new mobile advisories while tracking the reviewed Expo 56 chain
        run: |
          npm audit --json > "$RUNNER_TEMP/mobile-audit.json" || true
          node scripts/validate-audit.mjs "$RUNNER_TEMP/mobile-audit.json"
        working-directory: mobile
      - name: Export mobile web bundle
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npm run build
        working-directory: mobile

  launch-tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Validate executable 10k launch plan and zero-network dry-run
        run: |
          node --test tools/launch/test_*.mjs
          node tools/launch/execute_launch_plan.mjs --dry-run
      - name: Validate bounded read-only load profiles
        run: node --test tests/load/test_load_guard.mjs
      - name: Validate fingerprint, capture and public replay safety
        run: |
          python3 -m unittest discover -s tools/telematics/tests -p 'test_*.py' -v
          python3 tools/telematics/fingerprint.py --self-test

  playwright-public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build frontend against the local browser-test API origin
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4173
        run: npm run build
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - name: Block unsafe target and mutation configurations
        run: npm run test:guard
        working-directory: tests/e2e
      - name: Compile and enumerate all Playwright journeys
        run: npm run test:inventory
        working-directory: tests/e2e
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Execute anonymous local browser journeys
        env:
          E2E_TARGET_ENV: local
          E2E_UI_BASE_URL: http://127.0.0.1:4173
          E2E_API_BASE_URL: http://127.0.0.1:4173
        run: |
          cleanup() { kill "${preview_pid:-}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          (
            cd frontend
            exec node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort
          ) > "$RUNNER_TEMP/frontend-preview.log" 2>&1 &
          preview_pid=$!
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npm --prefix tests/e2e run test:local
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ env.CANDIDATE_SHA }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  dotnet-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend-dotnet/Opstrax.Api.csproj
      - run: dotnet build backend-dotnet/Opstrax.Api.csproj --no-restore
      - run: dotnet restore backend-dotnet.Tests/Opstrax.Tests.csproj
      - run: dotnet build backend-dotnet.Tests/Opstrax.Tests.csproj --no-restore
      - name: Enforce no-growth .NET warning baseline
        run: tools/verify-dotnet-warning-baseline.sh
      # DB-backed suites run in the dedicated integration job below (hermetic Postgres service),
      # not here — they require a live connection and write tenant data.
      - name: Run unit/source/regression tests
        run: dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj --no-build --filter "FullyQualifiedName!~Postgres&Category!=Integration"

  # Integration / DB-backed suites against a hermetic, disposable Postgres service (never prod).
  # Targets the DB via OPSTRAX_TEST_DB (TestDb helper). Schema is materialized the way a dev box
  # builds it: base init SQL + owner migrations, then the app's EnsureAsync at boot.
  dotnet-integration-tests:
    runs-on: ubuntu-latest
    # BLOCKING gate: the full DB-backed suite (94 tests incl. the rating engine money-math) runs
    # against a hermetic Postgres and must pass. Legacy schema drift that surfaced here has been
    # reconciled (feature_flags creation, enroll-on-create RLS, ai_recommendations backfills).
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: zayra
          POSTGRES_PASSWORD: zayra
          POSTGRES_DB: opstrax_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zayra -d opstrax_local"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPSTRAX_TEST_DB: "Host=127.0.0.1;Port=5433;Database=opstrax_local;Username=zayra;Password=zayra"
      OPSTRAX_TEST_DB_APP: "Host=127.0.0.1;Port=5433;Database=opstrax_local;Username=opstrax_app;Password=opstrax_app_local"
      OPSTRAX_TEST_DB_SYSTEM: "Host=127.0.0.1;Port=5433;Database=opstrax_local;Username=opstrax_system;Password=opstrax_system_local"
      PGPASSWORD: zayra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create independent restricted runtime roles
        run: |
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opstrax_app') THEN CREATE ROLE opstrax_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'opstrax_app_local'; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opstrax_system') THEN CREATE ROLE opstrax_system LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'opstrax_system_local'; END IF; END \$\$;"
      - name: Apply base schema + production owner migrations (fail closed)
        run: |
          for f in database/init/001_schema.sql database/init/002_seed.sql database/init/004_jobs_execution.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -q -f "$f"
          done
          for f in \
            database/migrations/2026_06_30_stage19_row_level_security.sql \
            database/migrations/2026_06_30_stage20_rls_force_and_app_role.sql \
            database/migrations/2026_07_01_stage22_rls_reconcile_coverage.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -q -f "$f"
          done
          NEON_PG_URI='postgresql://zayra:zayra@127.0.0.1:5433/opstrax_local?sslmode=disable' \
            ./tools/apply-neon-predeploy-migrations.sh
      - name: Prove the bounded document release hold
        run: |
          if NEON_PG_URI='postgresql://owner:secret@ep-empty-king-awv39an5.c-12.us-east-1.aws.neon.tech:5432/opstrax_staging?sslmode=disable&channel_binding=require' \
            python3 tools/psql-neon-env.py --print-safe-target >"$RUNNER_TEMP/unsafe-neon.out" 2>"$RUNNER_TEMP/unsafe-neon.err"; then
            echo "ERROR: unsafe Neon TLS settings were accepted" >&2
            exit 1
          fi
          grep -q 'require sslmode' "$RUNNER_TEMP/unsafe-neon.err"
          NEON_PG_URI='postgresql://owner:secret@ep-empty-king-awv39an5.c-12.us-east-1.aws.neon.tech:5432/opstrax_staging?sslmode=require&channel_binding=require' \
            python3 tools/psql-neon-env.py --print-safe-target | grep -q $'ep-empty-king-awv39an5.c-12.us-east-1.aws.neon.tech\t5432\topstrax_staging\towner'
          grep -q "prolang FROM fn)=(SELECT oid FROM pg_language WHERE lanname='plpgsql')" tools/manage-document-write-hold.sh
          grep -q 'AS locked_catalog_exact' tools/manage-document-write-hold.sh
          cleanup_hold() { ./tools/manage-document-write-hold.sh disable >/dev/null 2>&1 || true; }
          trap cleanup_hold EXIT
          export OPSTRAX_RELEASE_HOLD_TARGET=local-test
          export NEON_PG_URI='postgresql://zayra:zayra@127.0.0.1:5433/opstrax_local?sslmode=disable'
          ./tools/manage-document-write-hold.sh enable | tee "$RUNNER_TEMP/document-hold-enabled.json"
          grep -q '"holdActive":true' "$RUNNER_TEMP/document-hold-enabled.json"
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -tAc "SET ROLE opstrax_app; SELECT count(*) FROM documents" >/dev/null
          for statement in \
            "INSERT INTO documents(company_id,title) VALUES (1,'blocked')" \
            "UPDATE documents SET title=title WHERE false" \
            "DELETE FROM documents WHERE false"; do
            if psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 \
              -c "SET ROLE opstrax_app; $statement" >"$RUNNER_TEMP/document-hold-write.log" 2>&1; then
              echo "ERROR: restricted document write was not blocked" >&2
              exit 1
            fi
            grep -q 'temporarily paused for a controlled staging release' "$RUNNER_TEMP/document-hold-write.log"
          done
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 \
            -c 'ALTER FUNCTION public.opstrax_document_release_hold() PARALLEL SAFE'
          if ./tools/manage-document-write-hold.sh status >"$RUNNER_TEMP/document-hold-tamper.out" 2>"$RUNNER_TEMP/document-hold-tamper.err"; then
            echo "ERROR: modified function catalog was accepted" >&2
            exit 1
          fi
          grep -q 'unexpected or incomplete' "$RUNNER_TEMP/document-hold-tamper.err"
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 \
            -c 'ALTER FUNCTION public.opstrax_document_release_hold() PARALLEL UNSAFE'
          ./tools/manage-document-write-hold.sh status | grep -q '"catalogState":"exact"'
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE public.documents DISABLE TRIGGER trg_opstrax_document_release_hold'
          if ./tools/manage-document-write-hold.sh status >"$RUNNER_TEMP/document-hold-trigger-tamper.out" 2>"$RUNNER_TEMP/document-hold-trigger-tamper.err"; then
            echo "ERROR: disabled release-hold trigger was accepted" >&2
            exit 1
          fi
          grep -q 'unexpected or incomplete' "$RUNNER_TEMP/document-hold-trigger-tamper.err"
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE public.documents ENABLE TRIGGER trg_opstrax_document_release_hold'
          ./tools/manage-document-write-hold.sh status | grep -q '"catalogState":"exact"'
          ./tools/manage-document-write-hold.sh disable | tee "$RUNNER_TEMP/document-hold-disabled.json"
          trap - EXIT
          grep -q '"holdActive":false' "$RUNNER_TEMP/document-hold-disabled.json"
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -c "UPDATE documents SET title=title WHERE false"
      # ── Migration-pure oracle ────────────────────────────────────────────────
      # The opstrax_local database above is DEV-SHAPED on purpose: the next step boots
      # the app, which runs every runtime *SchemaService and creates the very columns
      # a protected environment will never have (Program.cs ShouldRunSchemaInitAsync
      # skips all of them under the restricted role + FORCE RLS). That makes this lane
      # structurally incapable of catching the missing-column class — it is why
      # RETEST-20260821-1035-R1 had to retract a Gate 1 PASS for /api/routes while
      # routes.efficiency_score existed in no migration.
      #
      # opstrax_migration_pure is built by the migration chain ONLY and is NEVER
      # booted against. The real controller SQL for the core journey endpoints is then
      # executed on it, so a column or table that exists only in a schema service
      # fails here as 42703/42P01 exactly as it would in staging. Keep BOTH databases:
      # the dev-shaped one still runs the integration suites below.
      - name: Build a migration-pure oracle database (never booted against)
        run: |
          createdb -h 127.0.0.1 -p 5433 -U zayra opstrax_migration_pure
          for f in \
            database/init/001_schema.sql \
            database/init/002_seed.sql \
            database/init/004_jobs_execution.sql \
            database/migrations/2026_06_30_stage19_row_level_security.sql \
            database/migrations/2026_06_30_stage20_rls_force_and_app_role.sql \
            database/migrations/2026_07_01_stage22_rls_reconcile_coverage.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_migration_pure -v ON_ERROR_STOP=1 -q -f "$f"
          done
          NEON_PG_URI='postgresql://zayra:zayra@127.0.0.1:5433/opstrax_migration_pure?sslmode=disable' \
            ./tools/apply-neon-predeploy-migrations.sh
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_migration_pure -v ON_ERROR_STOP=1 -q \
            -f database/migrations/2026_07_31_stage58_nonforgeable_tenant_ticket.sql
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_migration_pure -v ON_ERROR_STOP=1 -q \
            -f database/migrations/2026_07_31_stage59_data_protection_key_ring.sql
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_migration_pure -v ON_ERROR_STOP=1 -q \
            -f database/migrations/2026_08_11_stage76_telematics_security_hardening.sql
          echo "migration-pure tables: $(psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_migration_pure -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")"
      - name: Core journey controller SQL must resolve on the migration-pure database
        run: |
          # Verbatim fragments from the handlers named in each heading. @cid/@branchId
          # are bound to a literal tenant and NULL branch; the point is that every
          # referenced relation and column must RESOLVE, not that rows come back.
          # Update these when the handler SQL changes — that is the contract.
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_migration_pure -v ON_ERROR_STOP=1 <<'JOURNEY_SQL'
          \set QUIET on
          \set cid 1

          -- GET /api/routes  (EndpointMappings.Routes)
          SELECT r.*, COALESCE(r.route_name,r.name) route_name, v.vehicle_code, d.full_name driver_name,
                 (SELECT COUNT(*) FROM route_stops rs WHERE rs.route_id=r.id AND rs.company_id=r.company_id) stops,
                 CASE WHEN r.sla_risk='High' OR r.status IN ('Delayed','At Risk') THEN 'High' WHEN r.efficiency_score < 82 THEN 'Medium' ELSE 'Low' END delay_hotspot_badge,
                 CASE WHEN r.sla_risk='High' THEN 'Optimize sequence and send ETA updates'
                      WHEN r.efficiency_score < 82 THEN 'Run route optimization preview'
                      ELSE 'Release route plan' END recommended_action
          FROM routes r
          LEFT JOIN vehicles v ON v.id=r.assigned_vehicle_id AND v.company_id=r.company_id
          LEFT JOIN drivers d ON d.id=r.assigned_driver_id AND d.company_id=r.company_id
          WHERE r.company_id=:cid AND r.deleted_at IS NULL
          ORDER BY r.planned_start DESC, r.id DESC LIMIT 1;

          -- GET /api/routes/summary  (EndpointMappings.RoutesSummary)
          SELECT COUNT(*) FILTER (WHERE r.created_at::date=CURRENT_DATE) total_routes_today,
                 SUM(CASE WHEN status='Active' THEN 1 ELSE 0 END) active_routes,
                 SUM(CASE WHEN status='Planned' THEN 1 ELSE 0 END) planned_routes,
                 SUM(CASE WHEN status='Completed' THEN 1 ELSE 0 END) completed_routes,
                 SUM(CASE WHEN status IN ('Delayed','At Risk') THEN 1 ELSE 0 END) delayed_routes,
                 ROUND(AVG(total_stops),1) average_stops_per_route,
                 CONCAT(ROUND(AVG(estimated_duration_minutes)), ' min') average_route_eta,
                 ROUND(AVG(efficiency_score),1) route_efficiency_score,
                 SUM(CASE WHEN sla_risk='High' OR status IN ('Delayed','At Risk') THEN 1 ELSE 0 END) high_risk_routes,
                 CONCAT('$', TO_CHAR((COALESCE(SUM(cost_estimate),0))::numeric, 'FM9,999,999,999')) route_cost_estimate
          FROM routes r WHERE r.company_id=:cid AND r.deleted_at IS NULL;

          -- GET /api/expenses/summary  (EndpointMappings.ExpensesSummary)
          SELECT CONCAT('$', TO_CHAR((COALESCE(SUM(CASE WHEN expense_date >= DATE_TRUNC('month', CURRENT_DATE) THEN amount ELSE 0 END),0))::numeric, 'FM9,999,999,990.00')) total_expenses_this_month,
                 SUM(CASE WHEN approval_status='Pending' THEN 1 ELSE 0 END) pending_approval,
                 SUM(CASE WHEN approval_status='Approved' THEN 1 ELSE 0 END) approved_expenses,
                 SUM(CASE WHEN approval_status='Rejected' THEN 1 ELSE 0 END) rejected_expenses,
                 SUM(CASE WHEN category_name='Fuel' THEN amount ELSE 0 END) fuel_expenses,
                 SUM(CASE WHEN risk_score >= 60 THEN 1 ELSE 0 END) unusual_expenses,
                 SUM(CASE WHEN receipt_status='Missing' THEN 1 ELSE 0 END) missing_receipts
          FROM expenses WHERE company_id=:cid AND deleted_at IS NULL;

          -- GET /api/safety/summary  (SafetyCoachingScorecardPilotEndpoints.SafetyScorecardSummary)
          WITH scoped_drivers AS (
            SELECT d.id,d.company_id FROM drivers d WHERE d.company_id=:cid AND d.deleted_at IS NULL),
          recent_events AS (
            SELECT se.* FROM safety_events se JOIN scoped_drivers d ON d.id=se.driver_id AND d.company_id=se.company_id
            WHERE se.event_time>=NOW()-INTERVAL '30 days' AND se.deleted_at IS NULL AND LOWER(se.status)<>'dismissed')
          SELECT (SELECT ROUND(AVG(dss.score_30d),1) FROM scoped_drivers d JOIN driver_safety_scores dss ON dss.driver_id=d.id AND dss.company_id=d.company_id AND dss.computed_at>=NOW()-INTERVAL '2 hours' AND dss.events_90d>0) fleet_safety_score,
                 (SELECT COUNT(*) FROM scoped_drivers) total_drivers,
                 (SELECT COUNT(*) FROM recent_events WHERE severity='Critical' AND status NOT IN ('resolved','dismissed')) critical_events,
                 (SELECT COUNT(*) FROM recent_events WHERE event_type='Harsh Braking') harsh_braking;

          -- GET /api/settings/api-keys  (EndpointMappings.ApiKeysList) — 42P01 at R1
          SELECT id, key_prefix, last_four, label, created_by, created_at, last_used_at, revoked_at
          FROM tenant_api_keys WHERE company_id=:cid
          ORDER BY revoked_at IS NOT NULL, created_at DESC LIMIT 1;
          JOURNEY_SQL
          echo "core journey controller SQL resolved against a migration-pure schema"
      - name: Build API + tests
        run: |
          dotnet build backend-dotnet/Opstrax.Api.csproj
          dotnet build backend-dotnet.Tests/Opstrax.Tests.csproj
      - name: Materialize app schema (EnsureAsync via a bounded boot)
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5433;Database=opstrax_local;Username=zayra;Password=zayra"
          Rls__EnforceTenantContext: "false"
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8099
          Jwt__Key: "ci-only-jwt-signing-key-at-least-32-chars-long-000"
          # Telemetry__GatewaySecret deliberately NOT set: nothing consumes the legacy
          # fleet-wide secret any more (gateway ingest requires per-gateway credentials),
          # and ConfigValidationService flags its PRESENCE — warn in Development, fail
          # closed in protected environments. Setting it here was dead and contradictory.
        run: |
          (dotnet run --no-build --project backend-dotnet > /tmp/api_boot.log 2>&1 & echo $! > /tmp/api.pid)
          # Schema init (all *SchemaService.EnsureAsync) runs during startup and completes BEFORE the
          # app begins listening — so wait for that signal, not an arbitrary table count (which fired
          # mid-init and left issued_invoices/ai_action_outcomes uncreated + backfills unapplied).
          ok=0
          for i in $(seq 1 90); do
            if grep -qiE "Now listening on|Application started" /tmp/api_boot.log 2>/dev/null; then ok=1; break; fi
            if grep -qiE "Unhandled exception|Application startup exception|schema init.*fail" /tmp/api_boot.log 2>/dev/null; then echo "BOOT FAILED:"; tail -40 /tmp/api_boot.log; exit 1; fi
            sleep 2
          done
          sleep 8   # grace for any trailing ensure step
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true; sleep 2; kill -9 "$(cat /tmp/api.pid)" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "app never reported listening — boot log tail:"; tail -40 /tmp/api_boot.log; exit 1; }
          echo "tables after init: $(psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")"
      - name: Reapply mandatory terminal tenant and telemetry boundaries after schema materialization
        run: |
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -q \
            -f database/migrations/2026_07_31_stage58_nonforgeable_tenant_ticket.sql
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -q \
            -f database/migrations/2026_07_31_stage59_data_protection_key_ring.sql
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -q \
            -f database/migrations/2026_08_02_stage67_telematics_diagnostics_integrity.sql
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -q \
            -f database/migrations/2026_08_11_stage76_telematics_security_hardening.sql
          test "$(psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -tAc "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND roles='{public}'::name[]")" = "0"
          test "$(psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -tAc "SELECT count(*) FROM schema_migrations WHERE version='2026_08_11_stage76_telematics_security_hardening'")" = "1"
          test "$(psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -tAc "SELECT has_table_privilege('opstrax_app','eld_devices','SELECT') OR has_column_privilege('opstrax_app','eld_devices','api_key_hash','SELECT') OR has_column_privilege('opstrax_app','eld_devices','hmac_secret_encrypted','SELECT')")" = "f"
          test "$(psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -tAc "SELECT count(*) FROM pg_default_acl d LEFT JOIN pg_namespace n ON n.oid=d.defaclnamespace CROSS JOIN LATERAL aclexplode(d.defaclacl) a LEFT JOIN pg_roles r ON r.oid=a.grantee WHERE (d.defaclnamespace=0 OR n.nspname='public') AND d.defaclobjtype IN ('r','S') AND (a.grantee=0 OR r.rolname IN ('opstrax_app','opstrax_system'))")" = "0"
          psql -h 127.0.0.1 -p 5433 -U zayra -d opstrax_local -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $stage76_ci_terminal$
          BEGIN
            IF has_table_privilege('opstrax_app','canonical_telemetry_events','SELECT,INSERT,UPDATE,DELETE')
               OR NOT has_table_privilege('opstrax_system','canonical_telemetry_events','SELECT')
               OR NOT has_table_privilege('opstrax_system','canonical_telemetry_events','INSERT')
               OR has_table_privilege('opstrax_system','canonical_telemetry_events','UPDATE')
               OR NOT has_table_privilege('opstrax_system','canonical_telemetry_events','DELETE')
               OR has_table_privilege('opstrax_app','telemetry_replay_seen','SELECT,INSERT,UPDATE,DELETE')
               OR has_table_privilege('opstrax_app','telemetry_replay_device_state','SELECT,INSERT,UPDATE,DELETE')
               OR has_any_column_privilege('opstrax_app','telemetry_replay_seen','SELECT,INSERT,UPDATE,REFERENCES')
               OR has_any_column_privilege('opstrax_app','telemetry_replay_device_state','SELECT,INSERT,UPDATE,REFERENCES')
               OR has_any_column_privilege('opstrax_app','canonical_telemetry_events','SELECT,INSERT,UPDATE,REFERENCES')
               OR NOT has_table_privilege('opstrax_system','telemetry_replay_device_state','SELECT')
               OR NOT has_table_privilege('opstrax_system','telemetry_replay_device_state','INSERT')
               OR NOT has_table_privilege('opstrax_system','telemetry_replay_device_state','UPDATE')
               OR has_table_privilege('opstrax_system','telemetry_replay_device_state','DELETE')
               OR NOT has_column_privilege('opstrax_app','eld_devices','malfunction_resolved_at','UPDATE')
               OR NOT has_column_privilege('opstrax_app','eld_devices','malfunction_resolved_by','UPDATE')
               OR NOT has_column_privilege('opstrax_app','eld_devices','resolution_evidence','UPDATE')
               OR NOT has_column_privilege('opstrax_app','eld_devices','row_version','UPDATE')
               OR has_column_privilege('opstrax_app','eld_devices','company_id','UPDATE')
               OR has_column_privilege('opstrax_app','eld_devices','api_key_hash','UPDATE')
               OR has_sequence_privilege('opstrax_app','telemetry_replay_seen_id_seq','USAGE,SELECT,UPDATE')
               OR NOT has_sequence_privilege('opstrax_system','telemetry_replay_seen_id_seq','USAGE')
               OR NOT has_sequence_privilege('opstrax_system','telemetry_replay_seen_id_seq','SELECT')
               OR has_sequence_privilege('opstrax_system','telemetry_replay_seen_id_seq','UPDATE')
               OR has_sequence_privilege('opstrax_app','canonical_telemetry_events_id_seq','USAGE,SELECT,UPDATE')
               OR NOT has_sequence_privilege('opstrax_system','canonical_telemetry_events_id_seq','USAGE')
               OR NOT has_sequence_privilege('opstrax_system','canonical_telemetry_events_id_seq','SELECT')
               OR has_sequence_privilege('opstrax_system','canonical_telemetry_events_id_seq','UPDATE')
               OR to_regclass('public.telemetry_replay_device_state') IS NULL
               OR to_regclass('public.uq_telemetry_replay_seen_unwrapped') IS NULL
               OR EXISTS (SELECT 1 FROM telemetry_replay_device_state)
               OR EXISTS (
                 SELECT 1 FROM (VALUES
                   ('telemetry_replay_seen','unwrapped_serial'),
                   ('telemetry_replay_seen','event_id'),
                   ('telemetry_replay_device_state','device_id'),
                   ('telemetry_replay_device_state','last_raw_serial'),
                   ('telemetry_replay_device_state','high_water_unwrapped'),
                   ('telemetry_replay_device_state','updated_at')
                 ) required(table_name,column_name)
                 WHERE NOT EXISTS (
                   SELECT 1 FROM information_schema.columns actual
                   WHERE actual.table_schema='public'
                     AND actual.table_name=required.table_name
                     AND actual.column_name=required.column_name
                     AND actual.is_nullable='NO'
                 )
               ) THEN
              RAISE EXCEPTION 'Stage76 terminal telemetry ACL/schema evidence failed';
            END IF;
          END
          $stage76_ci_terminal$;
          SQL
      - name: Run DB-backed integration suites
        run: dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj --no-build --filter "FullyQualifiedName~Postgres|Category=Integration"

  # A release migration must work from the real predecessor baseline without
  # startup schema materialization masking a missing owner migration. This job
  # also boots the candidate in Production with separate restricted identities.
  production-shaped-release-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: zayra
          POSTGRES_PASSWORD: zayra
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zayra -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPSTRAX_TEST_DB_HOST: 127.0.0.1
      OPSTRAX_TEST_DB_PORT: "5433"
      OPSTRAX_TEST_DB_USER: zayra
      OPSTRAX_TEST_DB_PASSWORD: zayra
      OPSTRAX_TEST_DB_APP_PASSWORD: opstrax_app_local
      OPSTRAX_TEST_DB_SYSTEM_PASSWORD: opstrax_system_local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create independent restricted runtime roles
        env:
          PGPASSWORD: zayra
        run: |
          psql -h 127.0.0.1 -p 5433 -U zayra -d postgres -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opstrax_app') THEN CREATE ROLE opstrax_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'opstrax_app_local'; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opstrax_system') THEN CREATE ROLE opstrax_system LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'opstrax_system_local'; END IF; END \$\$;"
      - name: Prove clean predecessor migration and Production-shaped runtime
        run: |
          tools/test-predeploy-clean-chain.sh
          tools/test-production-shaped-local-rehearsal.sh

  release-container-builds:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: zayra
          POSTGRES_PASSWORD: zayra
