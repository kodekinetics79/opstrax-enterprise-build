          # The API image packages database/migrations/ as a DIRECTORY copy
          # (backend-dotnet/Dockerfile), so a per-file allowlist here can no longer
          # fall behind what ships. Assert the directory shape, that every migration
          # the predeploy runner enrolls exists, and that the retest-critical files
          # are present by name.
          test -d database/migrations
          test -d database/migrations/telematics
          ls database/migrations/*.sql >/dev/null
