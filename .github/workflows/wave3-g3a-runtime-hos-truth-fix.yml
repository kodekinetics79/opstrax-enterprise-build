name: Wave3 G3A runtime HOS truth fix

on:
  push:
    branches:
      - wave3/g3a-hos-workflow
    paths:
      - .github/workflows/wave3-g3a-runtime-hos-truth-fix.yml

permissions:
  contents: write

jobs:
  reconcile-hos-runtime-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave3/g3a-hos-workflow
          fetch-depth: 0

      - name: Remove fabricated HOS defaults and add source-authority repair columns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend-dotnet/Services/Batch6SchemaService.cs')
          text = path.read_text()

          replacements = [
            ('drive_time_remaining_minutes INT NOT NULL DEFAULT 660,', 'drive_time_remaining_minutes INT NULL,'),
            ('shift_time_remaining_minutes INT NOT NULL DEFAULT 840,', 'shift_time_remaining_minutes INT NULL,'),
            ('cycle_time_remaining_minutes INT NOT NULL DEFAULT 4200,', 'cycle_time_remaining_minutes INT NULL,'),
            ("status VARCHAR(80) NOT NULL DEFAULT 'OK',\n            hos_warning", "status VARCHAR(80) NOT NULL DEFAULT 'Unavailable',\n            hos_warning"),
          ]
          for old, new in replacements:
            if new in text:
              continue
            if old not in text:
              raise SystemExit(f'Expected exact Batch6 anchor not found: {old}')
            text = text.replace(old, new, 1)

          anchor = '''        new("hos_clocks",               "company_id",            "BIGINT NULL"),
        new("hos_clocks",               "branch_id",             "BIGINT NULL"),
'''
          additions = '''        new("hos_clocks",               "company_id",            "BIGINT NULL"),
        new("hos_clocks",               "branch_id",             "BIGINT NULL"),
        new("hos_clocks",               "clock_source",          "VARCHAR(80) NULL"),
        new("hos_clocks",               "source_event_id",       "VARCHAR(160) NULL"),
        new("hos_clocks",               "source_observed_at",    "TIMESTAMPTZ NULL"),
        new("hos_clocks",               "source_authority",      "VARCHAR(40) NOT NULL DEFAULT 'Unavailable'"),
        new("hos_clocks",               "source_quality",        "JSONB NULL"),
'''
          if 'new("hos_clocks",               "clock_source",' not in text:
            if anchor not in text:
              raise SystemExit('hos_clocks repair-column anchor not found')
            text = text.replace(anchor, additions, 1)

          path.write_text(text)
          PY
          git diff --check

      - name: Commit focused HOS runtime truth fix
        shell: bash
        run: |
          if git diff --quiet -- backend-dotnet/Services/Batch6SchemaService.cs; then
            echo 'No runtime truth change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-dotnet/Services/Batch6SchemaService.cs
          git commit -m 'fix(hos): remove runtime legal-time defaults'
          git push origin HEAD:wave3/g3a-hos-workflow
