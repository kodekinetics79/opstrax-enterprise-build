name: Camera provider ingest spine

on:
  pull_request:
    paths:
      - 'backend-dotnet/Services/CameraProviderIngestService.cs'
      - 'backend-dotnet/Services/CameraProviderStatusService.cs'
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Program.cs'
      - 'backend-dotnet.Tests/CameraProviderIngestContractTests.cs'
      - 'backend-dotnet.Tests/CameraProviderIngestPostgresTests.cs'
      - 'backend-dotnet.Tests/SamsaraCameraSafetyParserTests.cs'
      - 'backend-dotnet.Tests/SamsaraConnectorBehaviorTests.cs'
      - 'backend-dotnet.Tests/SamsaraResponseBoundsTests.cs'
      - 'backend-dotnet.Tests/ConnectorSecretHardeningTests.cs'
      - 'backend-dotnet.Tests/Fixtures/camera_connector_test_schema.sql'
      - 'backend-dotnet/Services/Connectors/SamsaraCameraSafetySync.cs'
      - 'backend-dotnet/Services/Connectors/SamsaraConnector.cs'
      - 'backend-dotnet/Services/Connectors/SamsaraSync.cs'
      - 'backend-dotnet/Services/Connectors/IConnector.cs'
      - 'backend-dotnet/Services/Connectors/ConnectorOperationLease.cs'
      - 'backend-dotnet/Services/Connectors/ConnectorRegistry.cs'
      - 'backend-dotnet/Services/ConnectorSyncBackgroundService.cs'
      - 'database/migrations/2026_09_07_stage112_camera_provider_ingest_spine.sql'
      - 'database/migrations/2026_09_07_stage113_samsara_account_identity.sql'
      - 'database/migrations/2026_09_07_stage114_camera_asset_reconciliation.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/services/dashcamApi.ts'
      - 'frontend/src/hooks/useBatch4.ts'
      - 'frontend/src/pages/Batch4SafetyPage.tsx'
      - 'frontend/src/pages/IntegrationsPage.tsx'
      - 'frontend/src/services/integrationsApi.ts'
      - 'frontend/scripts/test-camera-manual-metadata-contract.mjs'
      - 'frontend/scripts/test-samsara-camera-intake-contract.mjs'
      - '.github/workflows/camera-provider-ingest.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/Services/CameraProviderIngestService.cs'
      - 'backend-dotnet/Services/CameraProviderStatusService.cs'
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Program.cs'
      - 'backend-dotnet.Tests/CameraProviderIngestContractTests.cs'
      - 'backend-dotnet.Tests/CameraProviderIngestPostgresTests.cs'
      - 'backend-dotnet.Tests/SamsaraCameraSafetyParserTests.cs'
      - 'backend-dotnet.Tests/SamsaraConnectorBehaviorTests.cs'
      - 'backend-dotnet.Tests/SamsaraResponseBoundsTests.cs'
      - 'backend-dotnet.Tests/ConnectorSecretHardeningTests.cs'
      - 'backend-dotnet.Tests/Fixtures/camera_connector_test_schema.sql'
      - 'backend-dotnet/Services/Connectors/SamsaraCameraSafetySync.cs'
      - 'backend-dotnet/Services/Connectors/SamsaraConnector.cs'
      - 'backend-dotnet/Services/Connectors/SamsaraSync.cs'
      - 'backend-dotnet/Services/Connectors/IConnector.cs'
      - 'backend-dotnet/Services/Connectors/ConnectorOperationLease.cs'
      - 'backend-dotnet/Services/Connectors/ConnectorRegistry.cs'
      - 'backend-dotnet/Services/ConnectorSyncBackgroundService.cs'
      - 'database/migrations/2026_09_07_stage112_camera_provider_ingest_spine.sql'
      - 'database/migrations/2026_09_07_stage113_samsara_account_identity.sql'
      - 'database/migrations/2026_09_07_stage114_camera_asset_reconciliation.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'frontend/src/services/dashcamApi.ts'
      - 'frontend/src/hooks/useBatch4.ts'
      - 'frontend/src/pages/Batch4SafetyPage.tsx'
      - 'frontend/src/pages/IntegrationsPage.tsx'
      - 'frontend/src/services/integrationsApi.ts'
      - 'frontend/scripts/test-camera-manual-metadata-contract.mjs'
      - 'frontend/scripts/test-samsara-camera-intake-contract.mjs'
      - '.github/workflows/camera-provider-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-provider-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-provider-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opstrax_camera_stage112
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opstrax_camera_stage112"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      OPSTRAX_CAMERA_STAGE112_DB: Host=127.0.0.1;Port=55443;Database=opstrax_camera_stage112;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build dedicated camera database
        run: |
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/init/001_schema.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/migrations/2026_07_02_stage23_schema_migration_ledger.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage112_camera_provider_ingest_spine.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f backend-dotnet.Tests/Fixtures/camera_connector_test_schema.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage113_samsara_account_identity.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage114_camera_asset_reconciliation.sql
      - name: Verify repeat-safe migration
        run: |
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage112_camera_provider_ingest_spine.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage113_samsara_account_identity.sql
          psql -h 127.0.0.1 -p 55443 -U postgres -d opstrax_camera_stage112 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage114_camera_asset_reconciliation.sql
      - name: Run camera intake contract and PostgreSQL tests
        run: >-
          dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj
          --filter "FullyQualifiedName~CameraProviderIngestContractTests|FullyQualifiedName~CameraProviderIngestPostgresTests|FullyQualifiedName~SamsaraCameraSafetyParserTests|FullyQualifiedName~SamsaraConnectorBehaviorTests|FullyQualifiedName~SamsaraResponseBoundsTests|FullyQualifiedName~ConnectorSecretHardeningTests|FullyQualifiedName~TelemetryLaunchHardeningTests"
          --logger "console;verbosity=minimal"
      - name: Run camera frontend contracts
        run: |
          npm --prefix frontend run test:camera-manual-metadata
          npm --prefix frontend run test:samsara-camera-intake
      - name: Build camera customer surface
        run: npm --prefix frontend run build
