name: DeviceOps installation work-link governance

on:
  pull_request:
    paths:
      - 'backend-dotnet/Controllers/DeviceInstallationWorkPackageEndpoints.cs'
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet.Tests/DeviceInstallationWorkLinkContractTests.cs'
      - 'backend-dotnet.Tests/DeviceInstallationWorkLinkPostgresTests.cs'
      - 'backend-dotnet.Tests/Fixtures/device_installation_work_link_test_prerequisites.sql'
      - 'database/migrations/2026_09_07_stage121_device_installation_work_packages.sql'
      - 'database/migrations/2026_09_07_stage122_installation_work_package_links.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'tools/test-predeploy-clean-chain.sh'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-installation-work-link-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-installation-work-link-governance.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/Controllers/DeviceInstallationWorkPackageEndpoints.cs'
      - 'backend-dotnet/Controllers/EndpointMappings.cs'
      - 'backend-dotnet/Services/TelemetrySchemaService.cs'
      - 'backend-dotnet.Tests/DeviceInstallationWorkLinkContractTests.cs'
      - 'backend-dotnet.Tests/DeviceInstallationWorkLinkPostgresTests.cs'
      - 'backend-dotnet.Tests/Fixtures/device_installation_work_link_test_prerequisites.sql'
      - 'database/migrations/2026_09_07_stage121_device_installation_work_packages.sql'
      - 'database/migrations/2026_09_07_stage122_installation_work_package_links.sql'
      - 'tools/apply-neon-predeploy-migrations.sh'
      - 'tools/test-predeploy-clean-chain.sh'
      - 'frontend/src/pages/IotDevicesPage.tsx'
      - 'frontend/src/services/telematicsService.ts'
      - 'frontend/scripts/test-device-installation-work-link-contract.mjs'
      - 'frontend/package.json'
      - '.github/workflows/device-installation-work-link-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-installation-work-link-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  append-only-unverified-installation-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opstrax_deviceops_stage122
        ports:
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opstrax_deviceops_stage122"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      OPSTRAX_DEVICEOPS_STAGE122_DB: Host=127.0.0.1;Port=55447;Database=opstrax_deviceops_stage122;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build dedicated installation-link database
        run: |
          psql -h 127.0.0.1 -p 55447 -U postgres -d opstrax_deviceops_stage122 -v ON_ERROR_STOP=1 -f database/init/001_schema.sql
          psql -h 127.0.0.1 -p 55447 -U postgres -d opstrax_deviceops_stage122 -v ON_ERROR_STOP=1 -f database/migrations/2026_07_02_stage23_schema_migration_ledger.sql
          psql -h 127.0.0.1 -p 55447 -U postgres -d opstrax_deviceops_stage122 -v ON_ERROR_STOP=1 -f backend-dotnet.Tests/Fixtures/device_installation_work_link_test_prerequisites.sql
          psql -h 127.0.0.1 -p 55447 -U postgres -d opstrax_deviceops_stage122 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage121_device_installation_work_packages.sql
          psql -h 127.0.0.1 -p 55447 -U postgres -d opstrax_deviceops_stage122 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage122_installation_work_package_links.sql
      - name: Verify repeat-safe migration
        run: psql -h 127.0.0.1 -p 55447 -U postgres -d opstrax_deviceops_stage122 -v ON_ERROR_STOP=1 -f database/migrations/2026_09_07_stage122_installation_work_package_links.sql
      - name: Run contract and PostgreSQL tests
        run: >-
          dotnet test backend-dotnet.Tests/Opstrax.Tests.csproj
          --filter "FullyQualifiedName~DeviceInstallationWorkLinkContractTests|FullyQualifiedName~DeviceInstallationWorkLinkPostgresTests"
          --logger "console;verbosity=minimal"
      - name: Verify customer installation-link truth
        run: npm --prefix frontend run test:device-installation-work-link
      - name: Build customer device surface
        run: npm --prefix frontend run build
